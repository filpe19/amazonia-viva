# Host nginx vhost for Amazônia Viva on a shared server (/etc/nginx/sites-available/amazonia-viva).
# TLS is added by certbot (certbot --nginx -d <host>). To switch domains, add the new name to server_name and run certbot again.
server {
    listen 80;
    listen [::]:80;
    server_name amazoniaviva.179-197-65-61.sslip.io;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
