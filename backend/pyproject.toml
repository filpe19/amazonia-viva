[project]
name = "amazonia-viva-api"
version = "0.1.0"
description = "Amazônia Viva — API de inteligência ambiental (NASA FIRMS, NASA POWER, IBGE)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
