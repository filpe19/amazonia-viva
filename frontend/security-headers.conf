add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  # Política de conteúdo em modo de relatório (mapas e imagens vêm de vários provedores públicos)
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: blob: https:; connect-src 'self' https:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'; font-src 'self' data: https:" always;
