# nginx interno: arquivos estáticos + proxy da API. O TLS fica no Caddy (deploy/docker-compose.prod.yml).
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml text/plain;
  gzip_min_length 1024;
  gzip_proxied any;
  client_max_body_size 1m;

  include /etc/nginx/snippets/security-headers.conf;
  limit_req_status 429;

  # Behind a reverse proxy (Caddy or the host nginx), rate limits must use the client IP, not the proxy IP.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Cálculos pesados (focos, terras indígenas, cruzamentos, camadas): limite por IP e tempo maior
  location ~ ^/api/v1/territory/[^/]+/(hotspots|indigenous|attention|map-layers|ficha|deter)$ {
    limit_req zone=api_heavy burst=20 nodelay;
    proxy_pass http://api:8710;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }
  location /api/ {
    limit_req zone=api burst=60 nodelay;
    proxy_pass http://api:8710;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
  }

  # add_header num location anula os herdados do server: os cabeçalhos de segurança são incluídos de novo aqui
  location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; try_files $uri =404; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; include /etc/nginx/snippets/security-headers.conf; }
}
